; MARIGOLD UE5 RTX Demo — renderer + platform settings
; Target: UE 5.7.x on RTX 5070 Ti, VR via Virtual Desktop (PCVR/OpenXR)
; Verified CVars: r.MegaLights.Allowed / r.MegaLights.EnableForProject (5.7 names — r.MegaLights.Allow does not exist and is silently ignored), r.Lumen.HardwareRayTracing (web-verified 2026-10-15)

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Shader Model 6 required for Virtual Shadow Maps + Ray Tracing (UE 5.7).
D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Global Illumination: Lumen ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; --- Hardware ray tracing (RTX 5070 Ti) ---
; 2026-10-16: HWRT caused DXGI_ERROR_DRIVER_INTERNAL_ERROR (887A002B) on the 5070 Ti.
; 2026-10-20 (owner: "max it"): RT SUPPORT is compiled in, but RT is OFF at boot
; and only switched on at runtime by MarigoldRTX via r.RayTracing.Enable
; (r.RayTracing.EnableOnDemand=1, see [ConsoleVariables]). MarigoldRTX is
; crash-guarded: an unclean exit forces RT Off, persists Off, and writes
; r.RayTracing=False into Saved/Config/Windows/Engine.ini so the next boot has
; no RT support at all (pure software Lumen) until the user re-selects RT.
; ONE-LINE ROLLBACK if crashes continue with RT Off: set r.RayTracing=False here.
; AUDIT R8 (OPTIONAL, owner decision): False = no RT support compiled in at
; boot. Opting in via marigold.rtx writes r.RayTracing=True to
; Saved/Config/Windows/Engine.ini and applies after a restart. SIDE EFFECT:
; the in-game Graphics page hides RT options while this is False
; (MarigoldGraphicsSettings.cpp:136 reads r.RayTracing), so opt-in is
; console-only until that check is changed.
r.RayTracing=False
; RT requires the compute skin cache (editor crashes without it when RT is on).
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=False
r.GenerateMeshDistanceFields=True
; No landscape in the scene; skip landscape GI data build.
r.GenerateLandscapeGIData=False
; --- Shadows: virtual shadow maps (MegaLights path) ---
r.Shadow.Virtual.Enable=1
; --- MegaLights: HARD DISABLE for Blackwell (RTX 50-series) ---
; 5.7 CVar names are r.MegaLights.EnableForProject / r.MegaLights.Allowed.
r.MegaLights.EnableForProject=False
; --- VR ---
vr.InstancedStereo=True
vr.MobileMultiView=False
; --- VR comfort/perf: no motion blur, no DoF in HMD (disorienting + expensive) ---
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.DepthOfField=False
; --- SSAO off: Lumen provides GI-based AO; GTAO pass is redundant cost ---
r.DefaultFeature.AmbientOcclusion=False
; --- Anti-aliasing: TSR base (DLSS overrides at runtime via plugin) ---
r.DefaultFeature.AntiAliasing=4
r.TemporalAA.Algorithm=1
; --- Nanite: hard-enable for hero meshes (200k+ tri artist assets) ---
r.Nanite.ProjectEnabled=True
; --- Misc quality ---
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.Bloom=True
r.EyeAdaptationQuality=2

[/Script/Engine.Engine]
; Near clip kept small for VR comfort; far clip generous for the distant city
NearClipPlane=5.0

[ConsoleVariables]
; --- Blackwell stability: disable tearing (DWM interaction crash) ---
; Both CVar names present — experts disagree on which name is real; set both to 0.
r.D3D12.UseAllowTearing=0
r.D3D12.AllowTearing=0

; --- Swap chain: disable HDR10 output (crash viewport was DXGI 10-bit) ---
r.AllowHDR=0
r.HDR.EnableHDROutput=0
r.D3D12.NumBackBuffers=3
rhi.SyncInterval=1

; --- PSO disk caches: force ON (stale config had them off) ---
r.D3D12.PSO.DriverOptimizedDiskCache=1
r.D3D12.PSO.DiskCache=1

; --- GPU crash diagnostics (Blackwell 887A002B) ---
r.GPUCrashDebugging=1
r.D3D12.BreadCrumbs=1
r.D3D12.LightweightDRED=1
; --- Expert #5 GPU forensics (2026-10-19): RHI command-list bypass OFF ---
; Forces every RHI command through the command list so DRED breadcrumbs record
; the true GPU submission order (bypass can reorder/skip breadcrumb markers).
; Slight CPU cost; keep ON until the 887A002B crash is root-caused.
r.RHICmdBypass=0
; --- CVar verification notes (Expert #5, 2026-10-19) ---
; r.GPUCrashDebugging=1 already set above (real CVar, RenderCore).
; SKIPPED as unverifiable for UE 5.7 — no engine-source/doc evidence these exist,
; and bogus CVars are silently ignored (worse: they look like protection that
; isn't there). Do NOT re-add without verifying against engine source:
;   r.D3D12.GPUCrashDebugging, r.D3D12.EmitMeshDrawEventMarkers,
;   r.DRED.Enable, r.DRED.DebugMarkers
; --- Ray tracing skin cache (REQUIRED for HWRT — editor crashes without this) ---
; Disabled with HWRT 2026-10-16 (see above). Re-enable both together.
;r.SkinCache.CompileShaders=1  (now set in [/Script/Engine.RendererSettings] with r.RayTracing=True)
; --- NVIDIA Shader Execution Reordering (DISABLED — driver crash 887A002B) ---
; (stale enable removed 2026-10-16; DLSS fully disabled below)
; --- Ray tracing ON DEMAND (2026-10-20): compiled in, OFF at boot. ---
; r.RayTracing.EnableOnDemand=1 lets r.RayTracing.Enable toggle RT at runtime
; (UE 5.4+ CVars). MarigoldRTX is the ONLY writer of r.RayTracing.Enable /
; r.RayTracing.Shadows / r.Lumen.HardwareRayTracing (explicit opt-in or the
; crash-guarded first-boot default on flat PC; never in VR by default).
r.RayTracing.EnableOnDemand=1
r.RayTracing.Enable=0
r.RayTracing.Shadows=0
; --- MegaLights: DISABLED — 887A002B, confirmed 50-series-only bug (Epic) ---
; NOTE: the 5.7 CVar is r.MegaLights.Allowed (with 'd'); r.MegaLights.Allow is ignored.
r.MegaLights.Allowed=0
r.MegaLights.EnableForProject=0
r.MegaLights.SoftwareRayTracing.Allow=0
; --- Lumen hardware RT: DISABLED 2026-10-16 (driver crash 887A002B on 5070 Ti) ---
; Software Lumen only until NVIDIA driver matures. Re-enable together.
;r.Lumen.HardwareRayTracing=1
;r.Lumen.Reflections.HardwareRayTracing=1
; Hit Lighting for reflection rays: visibly better reflections on wet stone/glass.
;r.Lumen.HardwareRayTracing.LightingMode=1
; Extend HWRT reflections to semi-rough surfaces (default 0.4): wet plaza stone,
; ofrenda wood, papel picado get real reflections instead of blurry fallback.
;r.Lumen.Reflections.MaxRoughnessToTrace=0.6
;r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.6
; Faster Lumen scene updates keep up with flickering candle lights.
r.LumenScene.LightingUpdateSpeed=2
; --- NVIDIA DLSS 4.5 (DISABLED 2026-10-16 — causes DXGI 887A002B on RTX 50-series) ---
; Known Blackwell driver bug: DLSS/Streamline hooks into DX12 swap chain.
; See: Twinmotion 2026 RTX 50-series crash thread. Re-enable after NVIDIA fix.
; Using TSR (Temporal Super Resolution) instead — built into UE, no plugin.
r.NGX.Enable=0
r.NGX.DLSS.Enable=0
;r.NGX.DLSS.Quality=3
; DLSS sharpness 0-1 (default 0 = off). 0.25 = subtle crispness for DLAA.
; DISABLED 2026-10-17: DLSS is off on Blackwell until NVIDIA resolves 887A002B.
;r.NGX.DLSS.Sharpness=0.25
; --- DLSS Ray Reconstruction (EXPERIMENTAL — see note below) ---
; Uncomment ONLY after the DLSS 4.5 plugin is installed AND verified working
; (stat DLSS shows 1 feature allocated). Per NVIDIA's UE plugin guide, RR
; replaces the default denoisers — enabling denoisermode without RR active
; would REMOVE denoising and make reflections noisier. Verify first!
; r.NGX.DLSS.denoisermode=1
; r.Lumen.Reflections.BilateralFilter=0
; r.Lumen.Reflections.ScreenSpaceReconstruction=0
; r.Lumen.Reflections.Temporal=0
; r.Shadow.Denoiser=0
; --- DLSS Ray Reconstruction (STAGED — enable only after Streamline 2.x RR plugin verified) ---
;r.NGX.DLSS.RayReconstruction.Enable=1
;r.Lumen.Reflections.HardwareRayTracing=1
; --- Virtual shadow maps: bigger pool for 25+ candle lights ---
r.Shadow.Virtual.MaxPhysicalPages=2048
; Cheap grounding AO where VSM is soft (ofrenda objects).
r.ContactShadows=1
; --- Volumetric fog quality (candle-glow shafts) ---
; BURN-TECH-V2 C1: grid 8px (was 4px). 4px = 8x voxels; with 25 volumetric
; candle lights the lighting pass was the single most expensive GPU pass.
; Local fog volumes + shaft billboards carry the dense-glow look.
; (editor baseline; in game the grid size + supersampling are tier-owned —
; UMarigoldQualityManager::ApplyUserTierStatic: 12px Low .. 4px Cinematic)
r.VolumetricFog.GridPixelSize=8
; --- Polish ---
r.Tonemapper.Sharpen=0.4
; BURN-TECH-V2 C4: bloom 4 (was 5) — indistinguishable for small bright sources, cheaper.
r.BloomQuality=4
; --- BURN-TECH photorealism pass (2026-10-16): verified CVars only ---
; Reflection captures: 128 (single entry — the RendererSettings duplicate was removed 2026-10-17).
r.ReflectionCaptureResolution=128
; BURN-TECH-V2 C1/C5: volumetric grid/supersample tuned in the section above (8px, 2x).
; --- Fog / atmosphere ---
r.VolumetricFog=1
r.Fog=1
; --- Texture streaming: 4GB pool on the 16GB 5070 Ti (default is 1GB — thrashes on 4K PBR) ---
r.Streaming.PoolSize=4000
; Never let the pool exceed real VRAM: exhaustion -> paging -> TDR (887A002B).
r.Streaming.LimitPoolSizeToVRAM=1
; --- Zero texture pop-in: fully resident textures for this single 60m level ---
; REMOVED 2026-10-17: VRAM spike at init (was r.Streaming.FullyLoadUsedTextures=1)
; --- Lower CPU-GPU frame lag for Virtual Desktop streaming (slight parallelism tradeoff) ---
; REMOVED 2026-10-17: destabilizes D3D12 (was r.OneFrameThreadLag=0)
; --- BURN-DESIGN: photoreal lighting ---
; Volumetric fog: denser scattering for candle-glow air.
r.VolumetricFog.ScatteringDistribution=0.6
; Lumen: higher-quality GI for the night scene (more bounces in dark areas).
r.Lumen.DiffuseIndirect.SSAO=0
; Exposure: manual bias for night — protect highlights, lift shadows slightly.
r.EyeAdaptation.ExposureBias=0.3
; Contact shadows: sharper for small props (wax drips, petals).
r.ContactShadows.NonShadowCastingIntensity=0.4
; Reflection: brighter screen-space reflections on wet stone.
; BURN-TECH-V2 C3: SSR off (was 4) — r.ReflectionMethod=1 (Lumen) supersedes SSR;
; quality 4 was a redundant fullscreen reflection pass.
r.SSR.Quality=0

; --- GPU perf: shadow + Lumen cost (2026-10-20: now TIER-OWNED) ---
; The old global values were removed. They are set per graphics tier by
; UMarigoldQualityManager::ApplyUserTierStatic (Low/Medium keep perf values,
; High+ get full quality):
;   r.Shadow.Virtual.SMRT.SamplesPerRayLocal / RayCountLocal / ResolutionLodBiasLocal
;   r.LumenScene.Radiosity.ProbeSpacing, r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution
;   r.Lumen.ScreenProbeGather.DownsampleFactor, r.VolumetricFog.HistoryMissSupersampleCount
; NOTE: the removed r.Lumen.ScreenProbeGather.DownsampleFactor=2 was the opposite
; of a perf hack — it is the probe tile size in pixels (engine default 16), so 2
; placed far MORE screen probes (a large extra GPU load on every tier).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Marigold/Maps/OfrendaNight.OfrendaNight
EditorStartupMap=/Game/Marigold/Maps/OfrendaNight.OfrendaNight
GlobalDefaultGameMode=/Script/MarigoldFX.MarigoldGameMode
GlobalDefaultServerGameMode=None
; Dual-mode boot: UMarigoldGameInstance shows the Play on PC / Play in VR chooser
GameInstanceClass=/Script/MarigoldFX.MarigoldGameInstance

[/Script/HMDModule.HMDSettings]
; VR via Virtual Desktop uses the OpenXR runtime; keep HMD plugin generic
bEnableHMD=True
; NOTE: NVIDIA Reflex is enabled via Project Settings -> Streaming once the
; DLSS/Streamline plugin is installed (no documented Reflex CVar).

; --- DX11 FALLBACK (diagnostic only - uncomment to test if D3D12 is the problem) ---
; If DX11 works but D3D12 crashes, the issue is D3D12-driver specific.
; Cost: loses Nanite, VSM, SM6. Lumen works but degraded.
;[/Script/WindowsTargetPlatform.WindowsTargetSettings]
;DefaultGraphicsRHI=DefaultGraphicsRHI_DX11

[Core.System]
; --- Async loading (Event-Driven Loader) ---
s.EventDrivenLoaderEnabled=1
s.AsyncLoadingThreadEnabled=1
; Max ms/frame the async loader may spend on the game thread (default 5.0)
s.AsyncLoadingTimeLimit=8.0
; IoDispatcher read cache for NVMe (RTX 5070 Ti PC)
s.IoDispatcherCacheSizeMB=256

; --- MAX LOG VERBOSITY (wade's directive: maximum auto-logging for diagnosis) ---
; Added 2026-10-19 (Expert #1: UE Log Verbosity Max). All Marigold plugin log
; categories run at VeryVerbose; key engine categories at Verbose. This feeds
; the crash relay / telemetry pipeline with full context. LogTemp left at
; default to avoid third-party noise.
[Core.Log]
LogMarigoldFX=VeryVerbose
LogMarigoldBuilder=VeryVerbose
LogMarigoldRTX=VeryVerbose
LogMarigoldCandleRT=VeryVerbose
LogMarigoldLightMixer=VeryVerbose
LogMarigoldQualityTiers=VeryVerbose
LogMarigoldTelemetry=VeryVerbose
LogRenderer=Verbose
LogD3D12RHI=Verbose
LogD3D11RHI=Verbose
LogShaderCompilers=Verbose
LogMaterial=Verbose
LogStaticMesh=Verbose
LogSkeletalMesh=Verbose
LogPhysics=Verbose
LogAudio=Verbose
LogNet=Verbose
LogStreaming=Verbose
LogInit=Verbose
LogLoad=Verbose
LogUObjectGlobals=Verbose
